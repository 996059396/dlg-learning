name: CI
# 内容 CI 强制触发（P0-2）: 任何 push/PR 到 master/main 都跑全量门禁。
# 三 OS × Node 24 —— better-sqlite3 v13 只预编译 Node ABI 137(Node 24)，Node 20 会段错误。
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装后端依赖
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: 全量门禁（内容校验 + 接口/里程碑/排行/结算/安全不变量 + 判分扫描 + 数据完整性）
        working-directory: backend
        run: npm test

  # 前端：vitest 单测（纯逻辑模块）+ 生产构建。
  frontend-test:
    name: frontend-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 前端依赖
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: vitest 单测
        working-directory: frontend
        run: npm test

      - name: 生产构建
        working-directory: frontend
        run: npm run build

  # Electron 同源桌面壳跨平台冒烟（X01）：加载构建产物，断言标题含 DLG。
  # 仅 push 触发（PR 高频迭代不重复下载 ~100MB Electron）；Linux 用 xvfb-run。
  desktop-smoke:
    name: desktop-smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 后端依赖
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: 前端构建
        working-directory: frontend
        run: npm install --no-audit --no-fund && npm run build

      - name: 桌面依赖（含 Electron 二进制）
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: 冒烟（Linux xvfb，加 --no-sandbox 绕 CI 缺 SUID sandbox）
        if: runner.os == 'Linux'
        working-directory: desktop
        run: xvfb-run -a ./node_modules/.bin/electron . --smoke --no-sandbox

      - name: 冒烟（Windows / macOS）
        if: runner.os != 'Linux'
        working-directory: desktop
        run: ./node_modules/.bin/electron . --smoke

  # 浏览器级 e2e（crosscheck5 X H2/H3）：X07 安全头 + X02 PWA 离线 + 课程播放器。
  # 后端 109 断言门禁覆盖「无头 Node 层」，生产差异化能力全在浏览器层——这是唯一
  # 会拦截 Layout 白屏这类前端回归的自动化（此前零 CI 覆盖放行过 critical）。
  # ubuntu-only（含浏览器矩阵代表性，Electron/SW 已在另两个 job 覆盖）。
  e2e-browser:
    name: e2e-browser (ubuntu-latest)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 根依赖（puppeteer）
        run: npm install --no-audit --no-fund

      - name: 浏览器二进制
        run: npx puppeteer browsers install chrome

      - name: 后端依赖
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: 前端构建
        working-directory: frontend
        run: npm install --no-audit --no-fund && npm run build

      - name: test_pwa_e2e（安全头 + PWA 离线，生产单源 3100）
        run: node test_pwa_e2e.mjs

      - name: test_mobile_viewport（390px 移动视口横扫无溢出）
        run: node test_mobile_viewport.mjs
